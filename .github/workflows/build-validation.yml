name: TWRP NX733J - GitHub hosted

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twrp-nx733j-hosted
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      TWRP_ROOT: /home/runner/twrp
      ALLOW_MISSING_DEPENDENCIES: 'true'
      # soong_build runs with a restricted environment. Its launcher forwards
      # SOONG_GOMEMLIMIT as GOMEMLIMIT; the generic variable does not reach it.
      SOONG_GOMEMLIMIT: 10GiB
      USE_CCACHE: '1'
      CCACHE_EXEC: /usr/bin/ccache
      # Must stay under out/: Android's build sandbox makes other paths read-only.
      CCACHE_DIR: /home/runner/twrp/out/ccache
      CCACHE_TEMPDIR: /home/runner/twrp/out/ccache/tmp
      CCACHE_BASEDIR: /home/runner/twrp
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable GitHub runner
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]] || exit 1
          # These SDKs are removed only from GitHub's disposable VM.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/lib/powershell \
            /usr/share/swift /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-core gnupg flex bison \
            build-essential zip curl zlib1g-dev libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python-is-python3 libssl-dev \
            liblz4-tool lzop bc rsync ccache openjdk-17-jdk-headless
          sudo apt-get clean
          sudo fallocate -l 16G /mnt/twrp.swap
          sudo chmod 600 /mnt/twrp.swap
          sudo mkswap /mnt/twrp.swap
          sudo swapon /mnt/twrp.swap
          mkdir -p "$HOME/bin" "$TWRP_ROOT" "$GITHUB_WORKSPACE/build-artifacts"
          curl --fail --location --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name 'TWRP Builder'
          git config --global user.email 'twrp-builder@users.noreply.github.com'
          df -h
          free -h
      - name: Sync TWRP 16 sources
        run: |
          set -Eeuo pipefail
          cd "$TWRP_ROOT"
          repo init -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp \
            -b twrp-16.0 --depth=1
          synced=false
          for attempt in 1 2 3; do
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j4; then
              synced=true
              break
            fi
            sleep 10
          done
          "$synced"
          {
            echo '### Fuentes'
            printf 'Device tree: `%s`\n\n' "$GITHUB_SHA"
            printf 'TWRP: `%s`\n\n' "$(git -C bootable/recovery rev-parse HEAD)"
            printf 'Manifiesto SHA-256: `%s`\n' "$(repo manifest -r | sha256sum | cut -d ' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          df -h "$TWRP_ROOT"
      - name: Apply recovery fixes and validate image checks
        run: |
          set -Eeuo pipefail
          cd "$TWRP_ROOT/bootable/recovery"
          git apply --check "$GITHUB_WORKSPACE/.github/patches/twrp-flags-columns.patch"
          git apply "$GITHUB_WORKSPACE/.github/patches/twrp-flags-columns.patch"
          git apply --check "$GITHUB_WORKSPACE/.github/patches/image-size-preflight.patch"
          git apply "$GITHUB_WORKSPACE/.github/patches/image-size-preflight.patch"
          git apply --check "$GITHUB_WORKSPACE/.github/patches/logical-image-flash.patch"
          git apply "$GITHUB_WORKSPACE/.github/patches/logical-image-flash.patch"
          git apply --check "$GITHUB_WORKSPACE/.github/patches/nx733j-haptics.patch"
          git apply "$GITHUB_WORKSPACE/.github/patches/nx733j-haptics.patch"
          git apply --check "$GITHUB_WORKSPACE/.github/patches/image-target-message.patch"
          git apply "$GITHUB_WORKSPACE/.github/patches/image-target-message.patch"
          python3 "$GITHUB_WORKSPACE/.github/tests/test-image-preflight.py" partition.cpp
          python3 "$GITHUB_WORKSPACE/.github/tests/test-logical-image.py" partition.cpp
          echo 'Soporte IMG lógico: controles de OTA, mapeo, capacidad y escritura probados con E/S simulada.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Parche del parser twrp.flags aplicado correctamente.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Comprobaciones de tamaño IMG y sparse verificadas antes de escribir.' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: /home/runner/twrp/out/ccache
          key: twrp-ccache-v1-ubuntu22-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            twrp-ccache-v1-ubuntu22-${{ github.sha }}-
            twrp-ccache-v1-ubuntu22-
      - name: Build recovery from this exact commit
        id: build
        run: |
          set -Ee -o pipefail
          artifacts="$GITHUB_WORKSPACE/build-artifacts"
          mkdir -p "$CCACHE_TEMPDIR"
          ccache -M 5G
          ccache -o compression=true
          ccache -z
          build_started=$SECONDS
          finish() {
            status=$?
            trap - EXIT
            {
              echo '### Compilación'
              printf 'Duración: %s minutos. Código de salida: %s.\n\n' "$(( (SECONDS - build_started) / 60 ))" "$status"
              echo '```text'
              ccache -s
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if (( status != 0 )); then
              free -h
              df -h "$TWRP_ROOT"
              sudo dmesg -T | tail -n 80 || true
            fi
            exit "$status"
          }
          trap finish EXIT
          cd "$TWRP_ROOT"
          mkdir -p device/nubia/NX733J
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C device/nubia/NX733J
          build_label="by Draki b${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          printf 'TW_DEVICE_VERSION := %s\n' "$build_label" > device/nubia/NX733J/build-version.mk
          printf 'Identificación en TWRP: `%s`\n\n' "$build_label" >> "$GITHUB_STEP_SUMMARY"
          source build/envsetup.sh
          lunch twrp_NX733J
          # Use all four hosted-runner CPUs; keep the working Soong memory limit.
          m recoveryimage -j4
          img=out/target/product/NX733J/recovery.img
          [[ -s "$img" ]] && (( $(stat -c %s "$img") <= 104857600 ))
          cp "$img" "$artifacts/recovery-NX733J-${GITHUB_SHA:0:7}.img"
          {
            echo '### Imagen'
            printf 'Archivo: `recovery-NX733J-%s.img`\n\n' "${GITHUB_SHA:0:7}"
            printf 'Tamaño: %s bytes\n\n' "$(stat -c %s "$img")"
            printf 'SHA-256: `%s`\n' "$(sha256sum "$img" | cut -d ' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ramdisk interpreters before publishing
        run: |
          set -Eeuo pipefail
          root="$TWRP_ROOT/out/target/product/NX733J/recovery/root"
          [[ -d "$root" ]] || { echo 'Recovery root not found; build output missing.'; exit 1; }
          missing=0
          # Every script shipped by this device tree needs its shebang interpreter.
          while IFS= read -r script; do
            shebang=$(head -n1 "$script")
            [[ "$shebang" == '#!'* ]] || continue
            interpreter=${shebang:2}
            interpreter=${interpreter%%[[:space:]]*}
            if [[ ! -e "$root$interpreter" ]]; then
              echo "MISSING: $script requires interpreter $interpreter"
              missing=1
            fi
          done < <(find "$GITHUB_WORKSPACE/recovery/root" -type f -name '*.sh')
          # Every shell path on .rc exec/service lines must exist (comments ignored).
          while IFS= read -r shell_path; do
            if [[ ! -e "$root$shell_path" ]]; then
              echo "MISSING: init .rc references $shell_path"
              missing=1
            fi
          done < <(grep -rhE '^[[:space:]]*(exec|exec_background|exec_start|service)[[:space:]]' \
            "$GITHUB_WORKSPACE/recovery/root" --include='*.rc' \
            | grep -oE '/(sbin|system/bin|vendor/bin)/[A-Za-z_]*sh\b' | sort -u)
          if (( missing == 0 )); then
            echo 'Intérpretes del ramdisk verificados: todos existen.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$missing"
      - name: Upload recovery image only
        uses: actions/upload-artifact@v4
        with:
          name: NX733J-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-artifacts/*.img
          if-no-files-found: error
          retention-days: 14
      - name: Save compiler cache for the next build
        if: success()
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: /home/runner/twrp/out/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
